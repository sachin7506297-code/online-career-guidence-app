<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-card wide"><a class="logo" href="index.html">🎓 CareerPath</a><h1>Create Student Account</h1><p>Enter your basic information to personalize your experience.</p><form id="registerForm" class="form-grid"><label>Full Name<input id="regName" required></label><label>Email<input id="regEmail" type="email" required></label><label>Mobile<input id="regMobile" required></label><label>Age<input id="regAge" type="number" min="10" max="80" required></label><label>State<input id="regState" required></label><label>City<input id="regCity" required></label><label>Qualification<select id="regQualification"><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option><option>Diploma</option><option>Undergraduate</option><option>Graduate</option></select></label><label>Stream<input id="regStream" placeholder="Science / Commerce / Arts / Other"></label><label>Family income range<select id="regIncome"><option>Prefer not to say</option><option>Below ₹1 lakh</option><option>₹1–3 lakh</option><option>₹3–6 lakh</option><option>Above ₹6 lakh</option></select></label><label>Interests<input id="regInterests" placeholder="Technology, maths, art..."></label><label class="full check"><input type="checkbox" required> I agree to the terms and understand this is an educational guidance portal.</label><button class="btn primary full">Create Account</button></form><div id="registerMsg" class="form-msg"></div><p>Already registered? <a href="login.html">Login</a></p></div><script src="js/script.js"></script></body></html>
